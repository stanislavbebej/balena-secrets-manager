name: secrets-manager
type: sw.application
version: 1.0.0
description: >-
  A Balena Cloud block for centrally managing secrets across services in a fleet.
post-provisioning: >-
  A Balena Cloud block for centrally managing secrets across services in a fleet.
  It uses [summon](https://github.com/cyberark/summon) with the [summon-secrets-manager](https://github.com/stanislavbebej-ext43345/summon-secrets-manager)
  provider to fetch secrets from the [Bitwarden Secrets Manager](https://bitwarden.com/products/secrets-manager/).
assets:
  repository:
    type: blob.asset
    data:
      url: https://github.com/stanislavbebej/balena-secrets-manager
  logo:
    type: blob.asset
    data:
      url: >-
        https://raw.githubusercontent.com/stanislavbebej/balena-secrets-manager/main/logo.png
data:
  applicationEnvironmentVariables:
    - ROTATION_PERIOD: 1d
  defaultDeviceType: raspberrypi3-64
  supportedDeviceTypes:
    - generic-aarch64
    - raspberrypi4-64
    - raspberrypi5
